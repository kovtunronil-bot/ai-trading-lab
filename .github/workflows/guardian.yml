name: Bot Guardian

# Self-healing cadence for the AI Trading Robot. GitHub Actions delivers
# `schedule` runs with unpredictable delays (observed: minutes to hours),
# which can leave a trading bot silent for long stretches on a market day.
# Guardian runs on an INDEPENDENT schedule slot (:00/:30) and re-dispatches
# the bot whenever the bot's heartbeat (its last DB/journal commit) is older
# than ~45 minutes. The bot workflow itself is idempotent (safe to run more
# often than every 30 min).
#
# Optional SLA-grade upgrade: GitHub schedules stay best-effort. For a hard
# guarantee, add a fine-grained PAT (Actions: write) as the DISPATCH_TOKEN
# secret and point an external cron (e.g. https://cron-job.org) at
#   POST /repos/{owner}/{repo}/dispatches   {"event_type":"bot-cron"}
# enabled with `on.repository_dispatch` on a future workflow.

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Re-dispatch bot if heartbeat is cold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bot_heartbeat.sh "AI Trading Robot"