name: AI Trading Robot

on:
  schedule:
    - cron: '15,45 * * * *'                               # Every 30 min (UTC)
  workflow_dispatch:                       # Manual trigger button

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Seed self-learning memory (backfill from history)
      run: python seed_memory.py

    - name: Run trading bot
      env:
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        NTFY_TV_TOPIC: robot-mx7-bluefalcon-tv
      run: python cloud_bot.py

    - name: Commit DB changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "Trading Robot"
        git config user.email "robot@bot.local"
        git add lab.db config_*.json state.json proposals.json
        git diff --cached --quiet && exit 0
        git commit -m "bot update $(date -u +%Y-%m-%dT%H:%M)"
        git push origin HEAD:master
